services:

  nginx:
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=andrew
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=tinyurl_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andrew -d tinyurl_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  app1:
    build: .
    environment:
      - POSTGRES_USER=andrew
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=tinyurl_db
      - POSTGRES_HOST=db
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  app2:
    build: .
    environment:
      - POSTGRES_USER=andrew
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=tinyurl_db
      - POSTGRES_HOST=db
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  app3:
    build: .
    environment:
      - POSTGRES_USER=andrew
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=tinyurl_db
      - POSTGRES_HOST=db
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  postgres_data: