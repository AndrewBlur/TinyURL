
services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=andrew
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=tinyurl_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andrew -d tinyurl_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  app:
    build: .
    environment:
      - POSTGRES_USER=andrew
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=tinyurl_db
      - POSTGRES_HOST=db
      - HOST=localhost
      - PORT=8000
      - REDIS_URL=redis://cache:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
        
volumes:
  postgres_data:
