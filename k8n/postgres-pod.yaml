apiVersion: v1
kind: Pod

metadata:
  name: postgres
  labels:
    app: postgres
    
spec:
  containers:
    - name: postgres
      image: postgres:15-alpine

      ports:
        - containerPort: 5432

      env:
        - name: POSTGRES_USER
          value: "andrew"
        
        - name: POSTGRES_PASSWORD
          value: "123"

        - name: POSTGRES_DB
          value: "tinyurl_db"

      volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data

  volumes:
    - name: postgres-storage
      persistentVolumeClaim:
        claimName: postgres-pvc

